name: Deploy DynaGuard to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Live Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -x
            echo "🚀 Starting DynaGuard deployment..."
            cd ${{ secrets.DEPLOY_PATH }}

            echo "📥 Syncing latest changes from GitHub..."
            git config --global --add safe.directory "*" || true

            if [ ! -d ".git" ]; then
              echo "Git not initialized on server. Initializing..."
              git init -b main
              git remote add origin https://github.com/Abhi98989/dynaguard.git || git remote set-url origin https://github.com/Abhi98989/dynaguard.git
            else
              git remote set-url origin https://github.com/Abhi98989/dynaguard.git || true
            fi

            git fetch origin main
            git reset --hard origin/main

            echo "📦 Building and restarting containers..."
            docker compose down || true
            docker compose build api
            docker compose build dashboard

            echo "🚀 Starting services..."
            if ! docker compose up -d; then
              echo "❌ Deployment error! Printing container logs..."
              echo "--- MIGRATE LOGS ---"
              docker compose logs migrate || true
              echo "--- DB LOGS ---"
              docker compose logs db || true
              exit 1
            fi

            echo "🔍 Verifying running services..."
            docker compose ps

            echo "✅ Deployment completed successfully!"
