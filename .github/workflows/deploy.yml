name: Deploy DynaGuard to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Live Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          script: |
            echo "🚀 Starting DynaGuard deployment..."
            cd ${{ secrets.DEPLOY_PATH }}

            echo "📥 Syncing latest changes from GitHub..."
            git config --global --add safe.directory "*"
            git remote set-url origin https://github.com/Abhi98989/dynaguard.git || git remote add origin https://github.com/Abhi98989/dynaguard.git
            git fetch origin main
            git reset --hard origin/main

            echo "🛑 Stopping containers cleanly..."
            docker compose down --remove-orphans

            echo "📦 Building images..."
            docker compose build api dashboard

            echo "🚀 Starting containers..."
            docker compose up -d

            sleep 5
            echo "🔍 All Containers Status:"
            docker compose ps

            echo "📋 Dashboard container logs:"
            docker compose logs --tail=20 dashboard

            echo "📋 API container logs:"
            docker compose logs --tail=20 api

            echo "🧹 Cleaning up old unused images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
