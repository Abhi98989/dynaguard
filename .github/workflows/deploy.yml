name: Deploy DynaGuard to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Live Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting DynaGuard deployment..."
            cd ${{ secrets.DEPLOY_PATH }}

            echo "📥 Syncing latest changes from GitHub..."
            if [ ! -d ".git" ]; then
              echo "Git not initialized on server. Initializing repository..."
              git init -b main
              git remote add origin https://github.com/Abhi98989/dynaguard.git || git remote set-url origin https://github.com/Abhi98989/dynaguard.git
              git fetch origin main
              git reset --hard origin/main
              git branch --set-upstream-to=origin/main main
            else
              git fetch origin main
              git reset --hard origin/main
            fi

            echo "📦 Building and restarting containers..."
            docker compose down
            docker compose build
            docker compose up -d

            echo "🔍 Verifying running services..."
            docker compose ps

            echo "✅ Deployment completed successfully!"
