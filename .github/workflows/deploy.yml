name: Deploy DynaGuard to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Live Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          script: |
            echo "🚀 Starting DynaGuard deployment..."
            cd ${{ secrets.DEPLOY_PATH }}

            echo "📥 Syncing latest changes from GitHub..."
            git config --global --add safe.directory "*"
            git remote set-url origin https://github.com/Abhi98989/dynaguard.git || git remote add origin https://github.com/Abhi98989/dynaguard.git
            git fetch origin main
            git reset --hard origin/main

            echo "🛑 Stopping old containers and freeing port 3000..."
            docker compose down || true
            docker rm -f dynaguard-dashboard-1 dynaguard-api-1 || true
            pkill -9 -f "server.js" || true
            pkill -9 -f "next" || true
            fuser -k -9 3000/tcp || true
            python3 -c "import os, subprocess; [os.kill(int(l.split('pid=')[1].split(',')[0]), 9) for l in subprocess.getoutput('ss -tulpn').splitlines() if ':3000 ' in l and 'pid=' in l]" || true

            echo "📦 Building images with fresh code (no cache)..."
            docker compose build --no-cache api dashboard

            echo "🚀 Starting fresh containers..."
            docker compose up -d --force-recreate

            sleep 4
            echo "🔍 All Containers Status:"
            docker compose ps -a

            echo "📋 Dashboard container logs:"
            docker compose logs --tail=20 dashboard || true

            echo "📋 API container logs:"
            docker compose logs --tail=20 api || true

            echo "🧹 Cleaning up old unused images to save disk space..."
            docker image prune -f || true

            echo "✅ Deployment completed successfully!"
