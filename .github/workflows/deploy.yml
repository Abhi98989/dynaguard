name: Deploy DynaGuard to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Live Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          script: |
            echo "🚀 Starting DynaGuard deployment..."
            cd ${{ secrets.DEPLOY_PATH }}

            echo "📥 Syncing latest changes from GitHub..."
            git config --global --add safe.directory "*"
            git remote set-url origin https://github.com/Abhi98989/dynaguard.git || git remote add origin https://github.com/Abhi98989/dynaguard.git
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Building images with fresh code..."
            docker compose build api
            docker compose build dashboard

            echo "🛑 Freeing port 3000 and restarting containers..."
            docker compose down || true
            docker ps -q --filter "publish=3000" | xargs -r docker stop || true
            fuser -k 3000/tcp || true
            lsof -ti:3000 | xargs -r kill -9 || true
            docker compose up -d --force-recreate

            echo "🔍 Container Status:"
            docker compose ps

            echo "📋 Migration status:"
            docker compose logs --tail=20 migrate

            echo "✅ Deployment completed successfully!"
