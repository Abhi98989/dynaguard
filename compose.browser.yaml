# Optional browser worker. Default networks remain internal and fixture-only.
services:
  worker:
    image: dynaguard-worker-browser:local
    build:
      context: ./backend
      dockerfile: Dockerfile.browser
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    shm_size: 256m
    tmpfs: [/tmp:size=256m]
